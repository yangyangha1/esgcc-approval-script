<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>电商审批脚本设置</title><style>body{font:16px/1.65 system-ui;background:#f3f5f7;color:#182635;max-width:860px;margin:36px auto;padding:0 20px}section{background:white;padding:24px;margin:18px 0;border-radius:12px}h1{font-size:28px}h2{font-size:20px;margin-top:0}.notice{background:#fff5d6;border-left:4px solid #bd8600;padding:14px}label{display:block;margin:10px 0}input[type=text],input[type=password],input[type=number]{padding:8px;border:1px solid #aab7c4;border-radius:6px}button{background:#136454;color:white;padding:10px 18px;border:0;border-radius:6px;margin:8px 8px 0 0;cursor:pointer}pre{white-space:pre-wrap;word-break:break-word;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr}.hint{color:#526578;font-size:14px}#msg{font-weight:600}</style>
<h1>电商审批脚本</h1><div class="notice">定时任务按下方模式执行；“立即验证”始终不提交。真实审批须通过规则、令牌和流程校验，并确认列表移除。驳回、请购付款及签章流程暂留人工。</div>
<form id="form"><section><h2>运行安排</h2><label><input type="checkbox" id="validationOnly"> 定时仅验证，不提交审批（关闭则定时实际审批）</label><label><input type="checkbox" id="approvalEnabled"> 启用定时任务</label><label>执行时间（北京时间，逗号分隔） <input type="text" id="times" required placeholder="12:30,18:30"></label><div id="days"></div><label>单据处理间隔 <input type="number" id="processingIntervalSeconds" min="4" max="60"> 秒</label><label><input type="checkbox" id="keepaliveEnabled"> 持续保活</label><label>保活间隔 <input type="number" id="keepaliveMinutes" min="1" max="60"> 分钟</label><p class="hint">已保存的有效会话自动复用；失效时通知，不自动申请短信。Mac 休眠或关机期间无法保活。</p></section>
<section><h2>任务类型</h2><div id="types" class="grid"></div></section><section><h2>Bark 通知</h2><label><input type="checkbox" id="barkEnabled"> 开启 Bark</label><label>更换设备 Key <input type="password" id="barkKey" autocomplete="new-password" placeholder="留空保留现有配置"></label><p id="keyStatus" class="hint"></p><div id="notices" class="grid"></div><button type="button" onclick="testBark()">发送测试通知</button><p class="hint">Bark 返回接受仅代表推送服务接收，手机是否收到请实际确认。</p></section><button>保存设置</button><button type="button" onclick="runNow()">立即验证一次</button><span id="msg" role="status"></span></form><section><h2>运行状态</h2><div id="summary"></div><details><summary>查看脱敏运行记录</summary><pre id="status"></pre></details></section>
<script>
const token='__TOKEN__';const labels={materialBidEnabled:'物资竞价',materialConfirmEnabled:'物资结果确认',serviceBidEnabled:'服务竞价',serviceConfirmEnabled:'服务结果确认',materialProcurementEnabled:'物资请购（尚未支持）',serviceProcurementEnabled:'服务请购（尚未支持）',notifyApproved:'符合规则的任务',notifyManual:'需人工任务',notifyLoginExpired:'登录失效',notifyError:'执行异常',notifyZero:'零任务也通知'};
for(const [k,v] of Object.entries(labels)){const el=document.createElement('label');el.innerHTML=`<input type="checkbox" id="${k}"> ${v}`;document.getElementById(k.startsWith('notify')?'notices':'types').append(el)}
['日','一','二','三','四','五','六'].forEach((d,i)=>{const el=document.createElement('label');el.style.display='inline-block';el.style.marginRight='12px';el.innerHTML=`<input type="checkbox" id="day${i}">周${d}`;days.append(el)});
async function api(path,data){const r=await fetch('/api/'+path,data===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json','X-Local-Token':token},body:JSON.stringify(data)});const v=await r.json();if(!r.ok)throw Error(v.error||'请求失败');return v}
async function load(){const s=await api('settings');for(const [k,v]of Object.entries(s)){const el=document.getElementById(k);if(el&&el.type==='checkbox')el.checked=v}times.value=s.approvalTimes.join(',');s.approvalWeekdays.forEach(i=>document.getElementById('day'+i).checked=true);keepaliveMinutes.value=s.keepaliveMinutes;processingIntervalSeconds.value=s.processingIntervalSeconds||8;keyStatus.textContent=s.barkKeyConfigured?'已配置设备 Key；不会在页面回显。':'尚未配置设备 Key。';await refresh()}
async function refresh(){try{const s=await api('status');document.getElementById('status').textContent=JSON.stringify(s,null,2);document.getElementById('summary').textContent=`会话：${s.session==='LOGIN_OK'?'有效':s.session} · ${s.running?'正在验证':'等待下一次计划'} · 最近保活：${s.last_keepalive||'尚未检查'}`}catch(e){document.getElementById('summary').textContent='服务连接失败'}}
form.onsubmit=async e=>{e.preventDefault();const s={};document.querySelectorAll('input[type=checkbox]').forEach(x=>{if(!x.id.startsWith('day'))s[x.id]=x.checked});s.approvalTimes=times.value.split(/[,，]/).map(x=>x.trim()).filter(Boolean);s.approvalWeekdays=[0,1,2,3,4,5,6].filter(i=>document.getElementById('day'+i).checked);s.keepaliveMinutes=Number(keepaliveMinutes.value);s.processingIntervalSeconds=Number(processingIntervalSeconds.value);s.barkKey=barkKey.value;try{await api('settings',s);barkKey.value='';msg.textContent='已保存，后续检查自动使用新配置'}catch(e){msg.textContent=e.message}};
async function runNow(){try{await api('run',{});msg.textContent='已启动验证，不提交真实审批';setTimeout(refresh,2000)}catch(e){msg.textContent=e.message}}
async function testBark(){try{const r=await api('bark-test',{});msg.textContent=r.accepted?'Bark 已接受，请确认手机收到':r.disabled?'Bark 已关闭':'发送失败，请检查状态';await refresh()}catch(e){msg.textContent=e.message}}
load().catch(e=>msg.textContent=e.message);setInterval(refresh,10000);
</script></html>
